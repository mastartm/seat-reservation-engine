server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  # API aynı origin'den sunulur: tarayıcı için CORS gerekmez. "api" compose servisinin adıdır.
  location /api/ {
    proxy_pass http://api:8080;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
  }
  location = /health {
    proxy_pass http://api:8080;
  }

  # Vite çıktısındaki dosya adları içerik özetlidir (assets/index-<hash>.js): sonsuza kadar önbelleğe alınabilir.
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
  }
  # index.html asla uzun süre önbelleğe alınmaz, yoksa yeni sürüm eski özetli dosyalara bakar.
  location / {
    add_header Cache-Control "no-cache";
    try_files $uri /index.html;
  }
}
